name: Monthly Snapshot

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate snapshot
        run: python scripts/snapshot.py

      - name: Validate generated files
        run: |
          python -m json.tool latest.json >/dev/null
          test -s "snapshots/$(date -u +'%Y-%m').json"
          test -s "snapshots/$(date -u +'%Y-%m').csv"
          python scripts/validate.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots latest.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Update AI 500 snapshot for $(date -u +'%Y-%m')"
            git push
          fi
